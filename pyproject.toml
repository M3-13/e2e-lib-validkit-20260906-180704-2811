[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Eigenständige Bibliothek mit Prüf- und Normalisierungsfunktionen (nur Standardbibliothek)."
requires-python = ">=3.9"

[tool.setuptools]
packages = ["validkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
